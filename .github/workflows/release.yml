name: Выпуск релиза

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Проверить и упаковать плагин
        env:
          TAG: ${{ github.ref_name }}
        run: |
          root=package/database.linctrl
          mkdir -p "$root" archives
          cp -a plugin/. "$root/"
          jq -e --arg version "${TAG#v}" '.version = $version | select(.id and .entry and .apiVersion)' "$root/manifest.json" > "$root/manifest.tmp"
          mv "$root/manifest.tmp" "$root/manifest.json"
          entry=$(jq -r .entry "$root/manifest.json")
          test -f "$root/$entry"
          cd package
          zip -qr "../archives/desktop-database-plugin-$TAG.zip" 'database.linctrl'
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: archives/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
